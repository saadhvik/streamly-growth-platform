[project]
name = "streamly-growth-platform"
version = "0.1.0"
description = "Marketing attribution + trustworthy experimentation platform for Streamly"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    # >=2.0: sequential.py uses np.trapezoid, which replaced np.trapz in 2.0.
    # The two spellings do not coexist, so this floor is load-bearing.
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "streamlit>=1.30",
    "altair>=5.0",
]

# PyMC was in the original design for the Bayesian layer. That layer is built
# (experiment/bayesian.py) as a conjugate Beta-Binomial solved by quadrature, so
# PyMC is not needed: for two binomial proportions the posteriors are Beta
# distributions known in closed form. MCMC would add a ~200MB dependency, a
# convergence-diagnostics burden, and sampling noise that makes results
# irreproducible run to run -- all to approximate something exact.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tomllib is stdlib from 3.11; the test matrix floor is 3.10.
    'tomli; python_version < "3.11"',
    # Linters are pinned to a minor range, not floored. An unpinned linter makes
    # CI non-reproducible: ruff 0.16 changed its default rule set, so CI began
    # failing on code that had not changed and that passed locally on 0.12.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3.0",
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inherited. Ruff's defaults change between
# releases -- 0.16 dropped E402 from the default set, which silently turned
# every `# noqa: E402` in the app into an "unused directive" error. Naming the
# rules makes the lint outcome a property of this repo, not of the version.
# This is ruff's historical default set (what the project was in fact linted
# against) plus import sorting. Named explicitly so the outcome is a property of
# this repo rather than of whichever ruff version CI resolves to.
select = [
    "E4",    # imports: E401 multiple-imports, E402 import-not-at-top
    "E7",    # statement-level errors: comparisons, lambdas, bare except
    "E9",    # syntax and IO errors
    "F",     # pyflakes: undefined names, unused imports and variables
    "I",     # import sorting
]
# Deliberately NOT selected:
#   RUF001/RUF002  flag "ambiguous" unicode, but this codebase writes real
#                  statistical notation -- alpha, rho, +/-, and the minus sign
#                  appear in docstrings and UI copy on purpose.
#   E501           line length is enforced by review, not by a hard error; the
#                  long lines here are tables and prose in docstrings.
